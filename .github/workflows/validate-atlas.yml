name: Validate Atlas

on:
  push:
    branches: ["main", "v0.7-transform-live-fix"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deterministic evidence projection
        run: node scripts/build-evidence-graph.mjs --check

      - name: Check deterministic atom correspondence
        run: node scripts/build-correspondence.mjs --check

      - name: Check deterministic bond deltas
        run: node scripts/build-bond-deltas.mjs --check

      - name: Validate governed atlas
        run: node scripts/validate-atlas.mjs

      - name: Validate governed molecular structures
        run: node scripts/validate-structures.mjs

      - name: Validate governed comparison presets
        run: node scripts/validate-compare-presets.mjs

      - name: Validate governed transformation correspondence
        run: node scripts/validate-correspondence.mjs

      - name: Validate governed bond deltas
        run: node scripts/validate-bond-deltas.mjs

      - name: Validate static app JavaScript
        run: node scripts/validate-static-js.mjs

      - name: Validate botanical Leaf Morphology Lab
        run: npm run validate:leaflab

      - name: Validate LeafLab held-out research and null comparisons
        run: npm run validate:leaflab-study

      - name: Validate LeafLab independent annotation and external test quality
        run: npm run validate:leaflab-quality

      - name: Validate LeafLab local image segmentation and ridge graph
        run: npm run validate:leaflab-imaging

      - name: Validate LeafLab human vein reference and detector comparison
        run: npm run validate:leaflab-veins

      - name: Validate LeafLab network graph and fault tolerance baselines
        run: npm run validate:leaflab-networks

      - name: Validate BioNetwork packet routing and controlled outages
        run: npm run validate:leaflab-packets

      - name: Validate oncology evidence contract
        run: node scripts/validate-oncology.mjs

      - name: Validate Phi Research Bridge v2
        run: npm run validate:bridge

      - name: Validate Pain & ECS research domain
        run: npm run validate:pain-ecs

      - name: Validate archaeology evidence and source boundaries
        run: npm run validate:archaeology

      - name: Validate exploratory discovery hypotheses and evidence boundaries
        run: npm run validate:discovery

      - name: Validate Discovery Lab mass feature screening
        run: npm run validate:discovery-lab

      - name: Validate Discovery Lab MGF and MS/MS screening
        run: npm run validate:msms

      - name: Validate experimental MGF provenance audit
        run: npm run validate:discovery-provenance

      - name: Validate experimental MassBank reference standards
        run: npm run validate:massbank-reference

      - name: Generate measured reference spectrum benchmark report
        run: npm run build:massbank-report && npm run check:massbank-report

      - name: Upload measured reference spectrum benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: cannabiverse-massbank-benchmark-v0-4
          path: data/discovery/references/massbank/benchmark-report-v1.json
          if-no-files-found: error

