name: Validate Atlas

on:
  push:
    branches: ["main", "bootstrap-v0.1.0"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate governed atlas
        run: node scripts/validate-atlas.mjs
