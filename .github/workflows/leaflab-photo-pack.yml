name: LeafLab Public-Domain Starter Photo Pack

on:
  pull_request:
    paths:
      - "app/leaflab/real-photo-catalog.mjs"
      - "scripts/fetch-leaflab-real-photos.mjs"
      - ".github/workflows/leaflab-photo-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-open-leaf-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate approved source catalog offline
        run: node scripts/validate-leaflab-real-photos.mjs
      - name: Download and hash two verified original public-domain leaf photos
        run: node scripts/fetch-leaflab-real-photos.mjs --ids commons-leaf-earth-pd,commons-leaf-foliage-cc0 --out "$RUNNER_TEMP/leaflab-real-originals"
      - name: Upload source originals, attribution and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: leaflab-v14-public-domain-original-leaves
          path: ${{ runner.temp }}/leaflab-real-originals/
          if-no-files-found: error
          retention-days: 14
