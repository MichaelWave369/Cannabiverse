function showDetail(id){let c=D.claims.find(x=>x.claim_id===id),s=srcBy[c.source_ids[0]]||{},a=byId[c.subject_id]||{},b=byId[c.object_id]||{};detail.innerHTML='<h2>'+esc(c.claim_id)+'</h2><div class="id">'+esc(c.derived_from_edge_id)+'</div><div class="card"><b>Assertion</b><p>'+esc(label(c.subject_id))+'<br><strong>'+esc(c.predicate.replaceAll("_"," "))+'</strong><br>'+esc(label(c.object_id))+'</p></div><div class="card"><b>Authority</b><p>'+esc(c.evidence_lane)+'<br>'+esc(c.authority)+'<br>'+esc(c.status)+'</p></div>'+(c.note?'<div class="card"><b>Source note</b><p>'+esc(c.note)+'</p></div>':'')+'<div class="card"><b>Scientific source</b><p>'+esc(s.authors)+' ('+esc(s.year)+')<br>'+esc(s.title)+'</p>'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.doi||s.url)+'</a>':'')+'</div><div class="card"><b>Subject</b><p>'+esc(a.atlas_id||c.subject_id)+'<br>'+esc(a.name||a.label||"")+'</p></div><div class="card"><b>Object</b><p>'+esc(b.atlas_id||c.object_id)+'<br>'+esc(b.name||b.label||"")+'</p></div>'}
[ss,sy].forEach(x=>x.oninput=renderSources);[q,lane,status].forEach(x=>x.oninput=renderClaims);renderSources();renderClaims();showDetail(D.claims[0].claim_id);
